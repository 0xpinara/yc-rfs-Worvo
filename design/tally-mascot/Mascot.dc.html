<h1 style="margin: 0; font-size: 72px; font-weight: 600; font-stretch: 112%; line-height: 1; letter-spacing: -0.025em">Meet Tally</h1>
<p style="margin: 18px 0 0; max-width: 42ch; font-size: 19px; line-height: 1.55; color: #4A5D7E">Worvo’s sea otter. Sea otters are one of the few animals that use tools, so Tally carries a wrench, keeps a pencil behind one ear, and wears a wristband that listens.</p>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 32px">

<span style="font-size: 19px; font-weight: 600; font-stretch: 104%">Listening</span>
<span style="font-size: 15px; line-height: 1.45; color: #4A5D7E">Ears up while you describe the job.</span>
</figcaption>
</figure>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 12px">

</figcaption>
</figure>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 12px">

<span style="font-size: 19px; font-weight: 600; font-stretch: 104%">Has a question</span>
<span style="font-size: 15px; line-height: 1.45; color: #4A5D7E">Asks before it guesses.</span>
</figcaption>
</figure>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 12px">
<img src="./assets/dc233867dc480a31c37bca8bc764efc7.svg" alt="Tally floating on its back in the water, eyes closed and smiling, holding an invoice with a check mark" style="width: 200px; height: 200px">
