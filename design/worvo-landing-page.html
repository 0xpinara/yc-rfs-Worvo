  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

n:pl 1s ease-in-out infinite}\n@keyframes wv{0%,100%{transform:scaleY(0.3)}50%{transform:scaleY(1)}}\n@keyframes pl{0%,100%{opacity:1}50%{opacity:0.35}}\n@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div id=\"top\" style=\"font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; color: #0B1D3A; background: #F2F6FC; -webkit-font-smoothing: antialiased\" data-canvas-width=\"1440\" data-canvas-height=\"3300\" data-document-role=\"page\" data-label=\"Worvo landing page\">\n\n<div style=\"padding: 16px 16px 0\">\n<section class=\"on-dark\" aria-label=\"Introduction\" style=\"position: relative; background: {{stage}}; color: #FFFFFF; border-radius: 32px; padding: 0 clamp(20px, 5vw, 72px)\">\n<div aria-hidden=\"true\" style=\"position: absolute; inset: 0; border-radius: 32px; overflow: hidden; pointer-events: none\">\n<svg sc-camel-view-box=\"0 0 760 760\" style=\"position: absolute; top: -260px; right: -220px; width: 760px; height: 760px\"><circle class=\"rip\" cx=\"380\" cy=\"380\" r=\"110\"><\u002Fcircle><circle class=\"rip\" cx=\"380\" cy=\"380\" r=\"190\"><\u002Fcircle><circle class=\"rip\" cx=\"380\" cy=\"380\" r=\"270\"><\u002Fcircle><circle class=\"rip\" cx=\"380\" cy=\"380\" r=\"350\"><\u002Fcircle><\u002Fsvg>\n<\u002Fdiv>\n<div style=\"position: relative; max-width: 1200px; margin: 0 auto\">\n\n<header style=\"display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; padding: 24px 0\">\n<a href=\"#top\" aria-label=\"Worvo home\" style=\"display: flex; align-items: center; gap: 10px; min-height: 44px; color: #FFFFFF; text-decoration: none; font-size: 23px; font-weight: 700; font-stretch: 118%; letter-spacing: -0.01em\"><svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 26 26\" aria-hidden=\"true\"><circle class=\"ring\" cx=\"13\" cy=\"13\" r=\"11\"><\u002Fcircle><circle cx=\"13\" cy=\"13\" r=\"4.5\" fill=\"#A9C7FF\"><\u002Fcircle><\u002Fsvg><span>worvo<\u002Fspan><\u002Fa>\n<nav aria-label=\"Main\" style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 6px\">\n<a class=\"navlink\" href=\"#how\" style=\"display: flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 999px; color: #D3DEF3; text-decoration: none; font-size: 15px; font-weight: 500\">How it works<\u002Fa>\n<a href=\"#access\" style=\"display: flex; align-items: center; min-height: 44px; padding: 0 20px; border-radius: 999px; background: #A9C7FF; color: #0B1D3A; text-decoration: none; font-size: 15px; font-weight: 600\">Get early access<\u002Fa>\n<\u002Fnav>\n<\u002Fheader>\n\n<div style=\"padding: clamp(36px, 6vw, 88px) 0 clamp(56px, 7vw, 104px)\">\n<h1 style=\"margin: 0; font-size: clamp(40px, 6.4vw, 92px); font-weight: 600; font-stretch: 112%; line-height: 0.98; letter-spacing: -0.025em; color: #FFFFFF\"><span style=\"display: block\">Say it.<\u002Fspan><span style=\"display: block\">Send the invoice.<\u002Fspan><\u002Fh1>\n<div style=\"display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 32px 64px; margin-top: clamp(28px, 3.5vw, 48px)\">\n<p style=\"flex: 1 1 360px; max-width: 520px; margin: 0; font-size: 19px; line-height: 1.55; color: #C9D6EE; text-wrap: pretty\">Built for solo plumbers. Tell your wristband what you did on the job, and Worvo writes the invoice from your own prices, ready to send through Stripe.<\u002Fp>\n<div style=\"flex: 1 1 320px; max-width: 460px\">\n<sc-if value=\"{{heroOpen}}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display: flex; flex-direction: column; gap: 10px\">\n<label for=\"hero-email\" style=\"font-size: 14px; font-weight: 500; color: #C9D6EE\">Your email<\u002Flabel>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n<input id=\"hero-email\" type=\"email\" placeholder=\"you@yourbusiness.com\" value=\"{{heroEmail}}\" sc-camel-on-change=\"{{heroInput}}\" sc-camel-on-key-down=\"{{heroKey}}\" style=\"flex: 1 1 200px; min-width: 0; height: 52px; box-sizing: border-box; padding: 0 18px; border-radius: 14px; border: 1px solid rgba(169, 199, 255, 0.4); background: rgba(255, 255, 255, 0.07); color: #FFFFFF; font-size: 16px\">\n<button type=\"button\" sc-camel-on-click=\"{{heroJoin}}\" style=\"flex: 0 0 auto; height: 52px; padding: 0 22px; border: 0; border-radius: 14px; background: #A9C7FF; color: #0B1D3A; font-size: 16px; font-weight: 600; cursor: pointer\">Get early access<\u002Fbutton>\n<\u002Fdiv>\n<sc-if value=\"{{heroError}}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size: 14px; color: #FFD2A8\">Enter an email address so we can reach you.<\u002Fspan><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{heroJoined}}\" hint-placeholder-val=\"{{ false }}\"><p role=\"status\" style=\"margin: 0; font-size: 17px; line-height: 1.5; color: #FFFFFF\">You’re on the list. We’ll email you when early access opens.<\u002Fp><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px\">\n<div role=\"group\" aria-label=\"Example job\" style=\"display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: 26px; background: rgba(255, 255, 255, 0.06); box-shadow: inset 0 0 0 1px rgba(169, 199, 255, 0.24)\">\n<button type=\"button\" aria-pressed=\"{{readyOn}}\" sc-camel-on-click=\"{{pickReady}}\" style=\"min-height: 44px; padding: 0 18px; border: 0; border-radius: 999px; background: {{readyBg}}; color: {{readyFg}}; font-size: 15px; font-weight: 600; cursor: pointer; transition: background-color 200ms ease, color 200ms ease\">Everything’s on file<\u002Fbutton>\n<button type=\"button\" aria-pressed=\"{{heldOn}}\" sc-camel-on-click=\"{{pickHeld}}\" style=\"min-height: 44px; padding: 0 18px; border: 0; border-radius: 999px; background: {{heldBg}}; color: {{heldFg}}; font-size: 15px; font-weight: 600; cursor: pointer; transition: background-color 200ms ease, color 200ms ease\">Something’s unclear<\u002Fbutton>\n<\u002Fdiv>\n<button type=\"button\" sc-camel-on-click=\"{{replay}}\" style=\"display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border: 0; border-radius: 999px; background: rgba(255, 255, 255, 0); color: #D3DEF3; font-size: 15px; font-weight: 500; cursor: pointer\"><svg class=\"ic\" width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M3.5 12a8.5 8.5 0 1 0 2.6-6.1\"><\u002Fpath><path d=\"M3.5 4.5v4.5H8\"><\u002Fpath><\u002Fsvg><span>Replay<\u002Fspan><\u002Fbutton>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-wrap: wrap; align-items: flex-start; gap: 40px 72px; margin-top: 36px; margin-bottom: -150px\">\n\n<div style=\"flex: 7 1 420px; min-width: 0\">\n<p style=\"margin: 0; font-family: 'Newsreader', Georgia, 'Times New Roman', serif; font-style: italic; font-weight: 400; font-size: clamp(27px, 3vw, 44px); line-height: 1.26; letter-spacing: -0.01em; text-indent: -0.4em; text-wrap: pretty\"><span style=\"color: #A9C7FF\">“<\u002Fspan><sc-for list=\"{{tokens}}\" as=\"t\" hint-placeholder-count=\"34\"><span style=\"color: {{t.color}}; text-decoration-line: {{t.deco}}; text-decoration-color: {{t.decoColor}}; text-decoration-thickness: 2px; text-underline-offset: 0.22em; background-color: {{t.bg}}; border-radius: 6px; transition: color 240ms ease, background-color 200ms ease, text-decoration-color 320ms ease\">{{t.text}}<\u002Fspan><\u002Fsc-for><span style=\"color: #A9C7FF\">”<\u002Fspan><\u002Fp>\n<div aria-live=\"polite\" style=\"display: flex; align-items: center; gap: 12px; min-height: 44px; margin-top: 28px; font-size: 15px; line-height: 1.4; color: #C9D6EE\">\n<sc-if value=\"{{listening}}\" hint-placeholder-val=\"{{ true }}\"><span class=\"wave\" aria-hidden=\"true\" style=\"display: flex; align-items: center; gap: 3px; flex: 0 0 auto\"><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><\u002Fspan><\u002Fsc-if>\n<sc-if value=\"{{quiet}}\" hint-placeholder-val=\"{{ false }}\"><svg class=\"ic\" width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\" style=\"flex: 0 0 auto; color: #A9C7FF\"><rect x=\"6.5\" y=\"7\" width=\"11\" height=\"10\" rx=\"3\"><\u002Frect><path d=\"M8.5 7V3.5h7V7\"><\u002Fpath><path d=\"M8.5 17v3.5h7V17\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n<span>{{statusText}}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"paper\" style=\"flex: 5 1 340px; min-width: 0; max-width: 520px; box-sizing: border-box; padding: 28px; border-radius: 22px; background: #FFFFFF; color: #0B1D3A; box-shadow: 0 48px 96px -32px rgba(4, 16, 46, 0.55), 0 2px 8px rgba(4, 16, 46, 0.18)\">\n<div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px\">\n<span style=\"font-size: 14px; font-weight: 500; color: #4A5D7E\">Sample invoice<\u002Fspan>\n<span style=\"display: inline-flex; align-items: center; min-height: 28px; padding: 0 12px; border-radius: 999px; background: {{chipBg}}; color: {{chipFg}}; box-shadow: inset 0 0 0 1px {{chipRing}}; font-size: 13px; font-weight: 600; white-space: nowrap; transition: background-color 240ms ease, color 240ms ease\">{{chipText}}<\u002Fspan>\n<\u002Fdiv>\n\n<div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 24px\">\n<div style=\"opacity: {{custOp}}; transform: translateY({{custY}}px); transition: opacity 420ms ease, transform 420ms ease\">\n<div style=\"font-size: 13px; color: #4A5D7E\">Bill to<\u002Fdiv>\n<div style=\"margin-top: 4px; font-size: 18px; font-weight: 600; font-stretch: 104%\">Juniper Cafe<\u002Fdiv>\n<div style=\"margin-top: 2px; font-size: 14px; color: #4A5D7E; opacity: {{emailOp}}; transition: opacity 420ms ease\">Saved billing email<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"opacity: {{workOp}}; transform: translateY({{workY}}px); transition: opacity 420ms ease, transform 420ms ease\">\n<div style=\"font-size: 13px; color: #4A5D7E\">Service<\u002Fdiv>\n<div style=\"margin-top: 4px; font-size: 18px; font-weight: 600; font-stretch: 104%\">{{service}}<\u002Fdiv>\n<div style=\"margin-top: 2px; font-size: 14px; color: #4A5D7E\">Today<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<ul style=\"list-style: none; margin: 24px 0 0; padding: 0; border-top: 1px solid #E6ECF6\">\n<sc-for list=\"{{lines}}\" as=\"line\" hint-placeholder-count=\"2\">\n<li sc-camel-on-mouse-enter=\"{{line.enter}}\" sc-camel-on-mouse-leave=\"{{line.leave}}\" style=\"margin: 0 -28px; padding: 16px 28px; border-bottom: 1px solid #E6ECF6; background: {{line.rowBg}}; opacity: {{line.op}}; transform: translateY({{line.y}}px); transition: opacity 420ms ease, transform 420ms ease, background-color 200ms ease\">\n<div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 16px\">\n<span style=\"font-size: 16px; font-weight: 600\">{{line.name}}<\u002Fspan>\n<span style=\"font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; color: {{line.amountColor}}\">{{line.amount}}<\u002Fspan>\n<\u002Fdiv>\n<div style=\"margin-top: 2px; font-size: 14px; color: #4A5D7E; font-variant-numeric: tabular-nums\">{{line.detail}}<\u002Fdiv>\n<div style=\"margin-top: 8px; font-family: 'Newsreader', Georgia, 'Times New Roman', serif; font-style: italic; font-size: 17px; line-height: 1.35; color: #2F4A7A\">“{{line.quote}}”<\u002Fdiv>\n<sc-if value=\"{{line.phone}}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 13px; font-weight: 500; color: #1D3FB8\"><svg class=\"ic\" width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"7\" y=\"2.5\" width=\"10\" height=\"19\" rx=\"2.5\"><\u002Frect><path d=\"M11 18.5h2\"><\u002Fpath><\u002Fsvg><span>{{line.note}}<\u002Fspan><\u002Fdiv><\u002Fsc-if>\n<\u002Fli>\n<\u002Fsc-for>\n<\u002Ful>\n\n<sc-if value=\"{{asking}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"margin-top: 20px; padding: 18px; border-radius: 16px; background: #EEF3FD; box-shadow: inset 0 0 0 1px #D6E2F7\">\n<div style=\"display: flex; align-items: flex-start; gap: 12px\">\n<span aria-hidden=\"true\" style=\"flex: 0 0 auto; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: #2F5BEA; color: #FFFFFF; font-size: 15px; font-weight: 700\">?<\u002Fspan>\n<div>\n<div style=\"font-size: 16px; font-weight: 600\">Which parts make up the $45?<\u002Fdiv>\n<div style=\"margin-top: 4px; font-size: 14px; line-height: 1.45; color: #4A5D7E\">Worvo only bills parts it can match to your price list.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<button type=\"button\" sc-camel-on-click=\"{{answer}}\" style=\"margin-top: 14px; min-height: 44px; padding: 0 16px; border: 0; border-radius: 12px; background: #FFFFFF; color: #1D3FB8; box-shadow: inset 0 0 0 1px #B9CCF2; font-size: 15px; font-weight: 600; cursor: pointer\">Answer: two shutoff valves<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-top: 22px; opacity: {{totalOp}}; transition: opacity 420ms ease\">\n<span style=\"font-size: 15px; color: #4A5D7E\">Total due<\u002Fspan>\n<span style=\"font-size: 36px; font-weight: 600; font-stretch: 104%; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; color: {{totalColor}}\">{{totalText}}<\u002Fspan>\n<\u002Fdiv>\n\n<sc-if value=\"{{showConfirm}}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display: flex; flex-direction: column; gap: 10px; margin-top: 20px\">\n<button type=\"button\" disabled=\"{{confirmOff}}\" sc-camel-on-click=\"{{confirm}}\" style=\"min-height: 52px; border: 0; border-radius: 14px; background: {{confirmBg}}; color: {{confirmFg}}; font-size: 16px; font-weight: 600; cursor: {{confirmCursor}}; transition: background-color 240ms ease, color 240ms ease\">Confirm and send<\u002Fbutton>\n<span style=\"font-size: 13px; line-height: 1.4; color: #4A5D7E; text-align: center\">{{confirmNote}}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{showTrack}}\" hint-placeholder-val=\"{{ false }}\">\n<ol aria-label=\"Invoice status\" style=\"list-style: none; margin: 20px 0 0; padding: 0; display: flex; flex-direction: column; gap: 14px\">\n<sc-for list=\"{{track}}\" as=\"mark\" hint-placeholder-count=\"3\">\n<li style=\"display: flex; align-items: flex-start; gap: 12px\">\n<sc-if value=\"{{mark.done}}\" hint-placeholder-val=\"{{ true }}\"><span aria-hidden=\"true\" style=\"flex: 0 0 auto; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: #2F5BEA; color: #FFFFFF\"><svg class=\"ic\" width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fsc-if>\n<sc-if value=\"{{mark.now}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"pulse\" aria-hidden=\"true\" style=\"flex: 0 0 auto; width: 24px; height: 24px; box-sizing: border-box; border-radius: 50%; box-shadow: inset 0 0 0 2px #2F5BEA\"><\u002Fspan><\u002Fsc-if>\n<sc-if value=\"{{mark.next}}\" hint-placeholder-val=\"{{ false }}\"><span aria-hidden=\"true\" style=\"flex: 0 0 auto; width: 24px; height: 24px; box-sizing: border-box; border-radius: 50%; box-shadow: inset 0 0 0 2px #C9D8F2\"><\u002Fspan><\u002Fsc-if>\n<span style=\"display: flex; flex-direction: column; gap: 2px; padding-top: 2px\">\n<span style=\"font-size: 15px; font-weight: 600; color: {{mark.color}}\">{{mark.label}}<\u002Fspan>\n<span style=\"font-size: 13px; color: #4A5D7E\">{{mark.sub}}<\u002Fspan>\n<\u002Fspan>\n<\u002Fli>\n<\u002Fsc-for>\n<\u002Fol>\n<\u002Fsc-if>\n\n<p style=\"margin: 18px 0 0; font-size: 13px; color: #5B6E8F; text-align: center\">Tax not assessed in this sample.<\u002Fp>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fdiv>\n\n<section id=\"how\" aria-labelledby=\"how-title\" style=\"padding: 260px calc(16px + clamp(20px, 5vw, 72px)) clamp(88px, 10vw, 136px)\">\n<div style=\"max-width: 1200px; margin: 0 auto\">\n<h2 id=\"how-title\" style=\"margin: 0; max-width: 16ch; font-size: clamp(34px, 3.8vw, 56px); font-weight: 600; font-stretch: 110%; line-height: 1.04; letter-spacing: -0.025em\">Set it up once. Then just talk.<\u002Fh2>\n<ol style=\"list-style: none; margin: clamp(40px, 5vw, 72px) 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 48px 0\">\n<li style=\"padding-right: 40px\">\n<div aria-hidden=\"true\" style=\"display: flex; align-items: center\">\n<span style=\"flex: 0 0 auto; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: #FFFFFF; box-shadow: inset 0 0 0 2px #2F5BEA; color: #1D3FB8; font-size: 16px; font-weight: 600\">1<\u002Fspan>\n<span style=\"flex: 1 1 auto; height: 2px; margin-right: -40px; background: #C9D8F2\"><\u002Fspan>\n<\u002Fdiv>\n<h3 style=\"margin: 28px 0 0; font-size: 21px; font-weight: 600; font-stretch: 104%; letter-spacing: -0.01em\">Set up once<\u002Fh3>\n<p style=\"margin: 10px 0 0; max-width: 34ch; font-size: 17px; line-height: 1.6; color: #4A5D7E\">From your phone or browser, connect Stripe, add your customers, and save your labor rate and parts prices.<\u002Fp>\n<\u002Fli>\n<li style=\"padding-right: 40px\">\n<div aria-hidden=\"true\" style=\"display: flex; align-items: center\">\n<span style=\"flex: 0 0 auto; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: #FFFFFF; box-shadow: inset 0 0 0 2px #2F5BEA; color: #1D3FB8; font-size: 16px; font-weight: 600\">2<\u002Fspan>\n<span style=\"flex: 1 1 auto; height: 2px; margin-right: -40px; background: #C9D8F2\"><\u002Fspan>\n<\u002Fdiv>\n<h3 style=\"margin: 28px 0 0; font-size: 21px; font-weight: 600; font-stretch: 104%; letter-spacing: -0.01em\">Say what you did<\u002Fh3>\n<p style=\"margin: 10px 0 0; max-width: 34ch; font-size: 17px; line-height: 1.6; color: #4A5D7E\">Leaving the job, tell your band who it’s for, how long it took, and which parts you used. No laptop and no forms.<\u002Fp>\n<\u002Fli>\n<li style=\"padding-right: 40px\">\n<div aria-hidden=\"true\" style=\"display: flex; align-items: center\">\n<span style=\"flex: 0 0 auto; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: #FFFFFF; box-shadow: inset 0 0 0 2px #2F5BEA; color: #1D3FB8; font-size: 16px; font-weight: 600\">3<\u002Fspan>\n<span style=\"flex: 1 1 auto; height: 2px; background: linear-gradient(90deg, #C9D8F2, rgba(201, 216, 242, 0))\"><\u002Fspan>\n<\u002Fdiv>\n<h3 style=\"margin: 28px 0 0; font-size: 21px; font-weight: 600; font-stretch: 104%; letter-spacing: -0.01em\">Confirm and get paid<\u002Fh3>\n<p style=\"margin: 10px 0 0; max-width: 34ch; font-size: 17px; line-height: 1.6; color: #4A5D7E\">Check the draft and confirm with a tap. Stripe emails the invoice with a payment page, and you’ll see when it’s paid.<\u002Fp>\n<\u002Fli>\n<\u002Fol>\n<\u002Fdiv>\n<\u002Fsection>\n\n<div style=\"padding: 0 16px\">\n<section aria-labelledby=\"trust-title\" style=\"background: #E6EEFA; border-radius: 32px; padding: clamp(56px, 8vw, 112px) clamp(20px, 5vw, 72px)\">\n<div style=\"max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 48px 96px\">\n<h2 id=\"trust-title\" style=\"flex: 1 1 340px; margin: 0; max-width: 12ch; font-size: clamp(34px, 3.8vw, 56px); font-weight: 600; font-stretch: 110%; line-height: 1.04; letter-spacing: -0.025em\">It never guesses about money.<\u002Fh2>\n<div style=\"flex: 1.3 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 40px\">\n<div>\n<h3 style=\"margin: 0; font-size: 21px; font-weight: 600; font-stretch: 104%; letter-spacing: -0.01em\">It asks when something’s unclear<\u002Fh3>\n<p style=\"margin: 10px 0 0; max-width: 46ch; font-size: 17px; line-height: 1.6; color: #4A5D7E\">If it can’t tell who the customer is, how long you worked, or what a part costs, Worvo holds the draft and asks you one clear question.<\u002Fp>\n<\u002Fdiv>\n<div>\n<h3 style=\"margin: 0; font-size: 21px; font-weight: 600; font-stretch: 104%; letter-spacing: -0.01em\">Your prices, to the cent<\u002Fh3>\n<p style=\"margin: 10px 0 0; max-width: 46ch; font-size: 17px; line-height: 1.6; color: #4A5D7E\">The AI only picks out what you said. Every amount comes from your saved rates and parts prices, worked out exactly.<\u002Fp>\n<\u002Fdiv>\n<div>\n<h3 style=\"margin: 0; font-size: 21px; font-weight: 600; font-stretch: 104%; letter-spacing: -0.01em\">Nothing goes out without you<\u002Fh3>\n<p style=\"margin: 10px 0 0; max-width: 46ch; font-size: 17px; line-height: 1.6; color: #4A5D7E\">You approve the exact invoice and who it goes to. Change a line and it needs your OK again.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fdiv>\n\n<div style=\"padding: 16px 16px 0\">\n<section id=\"access\" class=\"on-dark\" aria-labelledby=\"access-title\" style=\"background: {{stage}}; color: #FFFFFF; border-radius: 32px; padding: clamp(56px, 8vw, 112px) clamp(20px, 5vw, 72px)\">\n<div style=\"max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 40px 96px\">\n<div style=\"flex: 1 1 420px; max-width: 640px\">\n<h2 id=\"access-title\" style=\"margin: 0; font-size: clamp(38px, 4.6vw, 68px); font-weight: 600; font-stretch: 112%; line-height: 1; letter-spacing: -0.025em\">Be first to try Worvo.<\u002Fh2>\n<p style=\"margin: 20px 0 0; max-width: 46ch; font-size: 18px; line-height: 1.6; color: #C9D6EE\">We’re building Worvo now, starting with solo plumbers who already have their own customers. Leave your email and we’ll write when early access opens.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 320px; max-width: 460px\">\n<sc-if value=\"{{endOpen}}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display: flex; flex-direction: column; gap: 10px\">\n<label for=\"end-email\" style=\"font-size: 14px; font-weight: 500; color: #C9D6EE\">Your email<\u002Flabel>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n<input id=\"end-email\" type=\"email\" placeholder=\"you@yourbusiness.com\" value=\"{{endEmail}}\" sc-camel-on-change=\"{{endInput}}\" sc-camel-on-key-down=\"{{endKey}}\" style=\"flex: 1 1 200px; min-width: 0; height: 52px; box-sizing: border-box; padding: 0 18px; border-radius: 14px; border: 1px solid rgba(169, 199, 255, 0.4); background: rgba(255, 255, 255, 0.07); color: #FFFFFF; font-size: 16px\">\n<button type=\"button\" sc-camel-on-click=\"{{endJoin}}\" style=\"flex: 0 0 auto; height: 52px; padding: 0 22px; border: 0; border-radius: 14px; background: #A9C7FF; color: #0B1D3A; font-size: 16px; font-weight: 600; cursor: pointer\">Get early access<\u002Fbutton>\n<\u002Fdiv>\n<sc-if value=\"{{endError}}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size: 14px; color: #FFD2A8\">Enter an email address so we can reach you.<\u002Fspan><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{endJoined}}\" hint-placeholder-val=\"{{ false }}\"><p role=\"status\" style=\"margin: 0; font-size: 17px; line-height: 1.5; color: #FFFFFF\">You’re on the list. We’ll email you when early access opens.<\u002Fp><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fdiv>\n\n<footer style=\"padding: 40px calc(16px + clamp(20px, 5vw, 72px)) 48px\">\n<div style=\"max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 32px; font-size: 14px; color: #4A5D7E\">\n<span style=\"display: flex; align-items: center; gap: 8px; color: #0B1D3A; font-size: 18px; font-weight: 700; font-stretch: 118%; letter-spacing: -0.01em\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 26 26\" aria-hidden=\"true\"><circle class=\"ring ring-d\" cx=\"13\" cy=\"13\" r=\"11\"><\u002Fcircle><circle cx=\"13\" cy=\"13\" r=\"4.5\" fill=\"#2F5BEA\"><\u002Fcircle><\u002Fsvg><span>worvo<\u002Fspan><\u002Fspan>\n<span>Invoices are sent and paid through Stripe.<\u002Fspan>\n<span>© 2026 Worvo<\u002Fspan>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;stage&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#0D2A66&quot;,&quot;options&quot;:[&quot;#0D2A66&quot;,&quot;#0A1F4D&quot;,&quot;#102F7A&quot;,&quot;#0B3B5C&quot;]},&quot;autoplay&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:3300}}\">\nclass Component extends DCLogic {\n  constructor(...args) {\n    super(...args);\n    this.state = {\n      scenario: 'ready',\n      step: 0,\n      phase: 'idle',\n      answered: false,\n      hover: null,\n      heroEmail: '',\n      heroJoined: false,\n      heroError: false,\n      endEmail: '',\n      endJoined: false,\n      endError: false\n    };\n    this.timer = null;\n    this.waits = [];\n  }\n\n  componentDidMount() {\n    if (this.props.autoplay === false) this.finish('ready');\n    else this.play('ready');\n  }\n\n  componentWillUnmount() {\n    this.stop();\n  }\n\n  stop() {\n    if (this.timer) {\n      clearInterval(this.timer);\n      this.timer = null;\n    }\n    this.waits.forEach((w) => clearTimeout(w));\n    this.waits = [];\n  }\n\n  later(fn, ms) {\n    this.waits.push(setTimeout(fn, ms));\n  }\n\n  calm() {\n    try {\n      return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);\n    } catch (e) {\n      return false;\n    }\n  }\n\n  jobs() {\n    return {\n      ready: {\n        segments: [\n          ['Worvo, invoice ', null],\n          ['Juniper Cafe', 'customer'],\n          [' for today’s ', null],\n          ['sink repair', 'service'],\n          ['. ', null],\n          ['Ninety minutes of labor at my usual rate', 'labor'],\n          [' and ', null],\n          ['two shutoff valves at the standard price', 'valves'],\n          ['. Send it to their ', null],\n          ['saved billing email', 'email'],\n          ['.', null]\n        ],\n        service: 'Sink repair',\n        emailFrom: 'email',\n        lines: [\n          { id: 'labor', name: 'Labor', detail: '90 min at $120.00 per hour', cents: 18000, quote: 'Ninety minutes of labor at my usual rate' },\n          { id: 'valves', name: 'Shutoff valve', detail: '2 at $22.50 each', cents: 4500, quote: 'two shutoff valves at the standard price' }\n        ]\n      },\n      held: {\n        segments: [\n          ['Worvo, invoice ', null],\n          ['Juniper Cafe', 'customer'],\n          [' for this morning’s ', null],\n          ['drain clearing', 'service'],\n          ['. ', null],\n          ['One hour at my usual rate', 'labor'],\n          [', plus ', null],\n          ['forty-five dollars in parts', 'parts'],\n          ['.', null]\n        ],\n        service: 'Drain clearing',\n        emailFrom: 'customer',\n        lines: [\n          { id: 'labor', name: 'Labor', detail: '60 min at $120.00 per hour', cents: 12000, quote: 'One hour at my usual rate' },\n          {\n            id: 'parts', ask: true, name: 'Parts', detail: 'Not itemized yet', cents: 0, quote: 'forty-five dollars in parts',\n            fix: { name: 'Shutoff valve', detail: '2 at $22.50 each', cents: 4500, note: 'Itemized from your phone' }\n          }\n        ]\n      }\n    };\n  }\n\n  words(job) {\n    const out = [];\n    job.segments.forEach((seg) => {\n      const parts = seg[0].match(/\\s*\\S+\\s*/g) || [seg[0]];\n      parts.forEach((w) => out.push({ text: w, p: seg[1] }));\n    });\n    return out;\n  }\n\n  timing(words) {\n    const times = [];\n    let t = 400;\n    words.forEach((w) => {\n      times.push(t);\n      const s = w.text.trim();\n      t += /[A-Za-z0-9]/.test(s) ? 170 : 40;\n      if (/,$/.test(s)) t += 240;\n      if (/\\.$/.test(s)) t += 460;\n    });\n    return times;\n  }\n\n  finish(key) {\n    this.stop();\n    const n = this.words(this.jobs()[key]).length;\n    this.setState({ scenario: key, step: n, phase: key === 'held' ? 'held' : 'ready', answered: false, hover: null });\n  }\n\n  play(key) {\n    this.stop();\n    if (this.calm()) {\n      this.finish(key);\n      return;\n    }\n    const words = this.words(this.jobs()[key]);\n    const times = this.timing(words);\n    const total = words.length;\n    this.setState({ scenario: key, step: 0, phase: 'listening', answered: false, hover: null });\n    const start = Date.now();\n    this.timer = setInterval(() => {\n      const elapsed = Date.now() - start;\n      let s = 0;\n      while (s < total && times[s] <= elapsed) s += 1;\n      if (s !== this.state.step) this.setState({ step: s });\n      if (s >= total) {\n        clearInterval(this.timer);\n        this.timer = null;\n        this.later(() => this.setState({ phase: 'drafting' }), 200);\n        this.later(() => this.setState({ phase: key === 'held' ? 'held' : 'ready' }), 1200);\n      }\n    }, 40);\n  }\n\n  join(which) {\n    const value = String(this.state[which + 'Email'] || '').trim();\n    if (/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(value)) {\n      this.setState({ [which + 'Joined']: true, [which + 'Error']: false });\n    } else {\n      this.setState({ [which + 'Error']: true });\n    }\n  }\n\n  money(c) {\n    const d = Math.floor(c / 100);\n    const r = String(c % 100).padStart(2, '0');\n    return '$' + d.toLocaleString('en-US') + '.' + r;\n  }\n\n  renderVals() {\n    const st = this.state;\n    const stage = this.props.stage ?? '#0D2A66';\n    const key = st.scenario;\n    const job = this.jobs()[key];\n    const words = this.words(job);\n    const total = words.length;\n    const step = st.step;\n    const phase = st.phase;\n\n    const ends = {};\n    words.forEach((w, i) => {\n      if (w.p) ends[w.p] = i + 1;\n    });\n    const heard = (p) => !!ends[p] && step >= ends[p];\n\n    const tokens = words.map((w, i) => {\n      const recognized = !!w.p && heard(w.p);\n      const hot = recognized && st.hover === w.p;\n      let decoColor = 'rgba(169, 199, 255, 0)';\n      if (recognized) decoColor = hot ? '#FFFFFF' : 'rgba(169, 199, 255, 0.65)';\n      return {\n        text: w.text,\n        color: i < step ? '#FFFFFF' : '#6F8CC4',\n        deco: w.p ? 'underline' : 'none',\n        decoColor: decoColor,\n        bg: hot ? 'rgba(169, 199, 255, 0.22)' : 'rgba(169, 199, 255, 0)'\n      };\n    });\n\n    const leave = () => this.setState({ hover: null });\n    const lines = job.lines.map((ln) => {\n      const fixed = !!ln.ask && st.answered;\n      const pending = !!ln.ask && !st.answered;\n      const src = fixed ? ln.fix : ln;\n      const on = heard(ln.id);\n      return {\n        name: src.name,\n        detail: src.detail,\n        amount: pending ? 'Pending' : this.money(src.cents),\n        amountColor: pending ? '#5B6E8F' : '#0B1D3A',\n        quote: ln.quote,\n        phone: fixed,\n        note: fixed ? ln.fix.note : '',\n        op: on ? 1 : 0,\n        y: on ? 0 : 10,\n        rowBg: st.hover === ln.id ? '#F1F5FD' : 'rgba(241, 245, 253, 0)',\n        enter: () => this.setState({ hover: ln.id }),\n        leave: leave\n      };\n    });\n\n    const open = job.lines.some((ln) => ln.ask && !st.answered);\n    const cents = job.lines.reduce((sum, ln) => {\n      if (ln.ask) return sum + (st.answered ? ln.fix.cents : 0);\n      return sum + ln.cents;\n    }, 0);\n    const drafted = step >= total && phase !== 'listening' && phase !== 'idle';\n\n    const chips = {\n      idle: ['Listening', '#FFFFFF', '#2F4A7A', '#C9D8F2'],\n      listening: ['Listening', '#FFFFFF', '#2F4A7A', '#C9D8F2'],\n      drafting: ['Drafting', '#FFFFFF', '#2F4A7A', '#C9D8F2'],\n      held: ['1 question', '#FFFFFF', '#1D3FB8', '#2F5BEA'],\n      ready: ['Ready to send', '#E3ECFF', '#1D3FB8', '#E3ECFF'],\n      sending: ['Sending', '#E3ECFF', '#1D3FB8', '#E3ECFF'],\n      sent: ['Sent', '#2F5BEA', '#FFFFFF', '#2F5BEA']\n    };\n    const chip = chips[phase] || chips.idle;\n\n    const notes = {\n      idle: 'Listening…',\n      listening: 'Listening…',\n      drafting: 'Matching the customer and your saved prices…',\n      held: 'One question before this can go out.',\n      ready: 'Draft ready. Nothing sends until you confirm.',\n      sending: 'Sending through Stripe…',\n      sent: 'Sent. Juniper Cafe gets the invoice with a payment page.'\n    };\n\n    const canSend = phase === 'ready';\n    const sentNow = phase === 'sent';\n    const isListening = phase === 'listening' || phase === 'idle';\n    let confirmNote = 'Unlocks when the draft is complete.';\n    if (canSend) confirmNote = 'You’ll confirm with one tap on your phone.';\n    else if (phase === 'held') confirmNote = 'Answer the question first.';\n\n    return {\n      stage: stage,\n      tokens: tokens,\n      lines: lines,\n      service: job.service,\n      listening: isListening,\n      quiet: !isListening,\n      statusText: notes[phase] || notes.idle,\n      custOp: heard('customer') ? 1 : 0,\n      custY: heard('customer') ? 0 : 10,\n      emailOp: heard(job.emailFrom) ? 1 : 0,\n      workOp: heard('service') ? 1 : 0,\n      workY: heard('service') ? 0 : 10,\n      chipText: chip[0],\n      chipBg: chip[1],\n      chipFg: chip[2],\n      chipRing: chip[3],\n      asking: phase === 'held' && open,\n      totalOp: drafted ? 1 : 0,\n      totalText: open ? 'Pending' : this.money(cents),\n      totalColor: open ? '#5B6E8F' : '#0B1D3A',\n      showConfirm: phase !== 'sending' && phase !== 'sent',\n      showTrack: phase === 'sending' || phase === 'sent',\n      confirmOff: !canSend,\n      confirmBg: canSend ? '#2F5BEA' : '#E4EBF6',\n      confirmFg: canSend ? '#FFFFFF' : '#5B6E8F',\n      confirmCursor: canSend ? 'pointer' : 'not-allowed',\n      confirmNote: confirmNote,\n      track: [\n        { done: true, now: false, next: false, label: 'Confirmed by you', sub: 'This exact invoice and recipient', color: '#0B1D3A' },\n        { done: sentNow, now: !sentNow, next: false, label: sentNow ? 'Sent through Stripe' : 'Sending through Stripe', sub: 'Email with a payment page and PDF', color: '#0B1D3A' },\n        { done: false, now: false, next: true, label: 'Paid', sub: 'Shows here when Juniper Cafe pays', color: '#5B6E8F' }\n      ],\n      readyOn: key === 'ready',\n      heldOn: key === 'held',\n      readyBg: key === 'ready' ? '#FFFFFF' : 'rgba(255, 255, 255, 0)',\n      readyFg: key === 'ready' ? '#0B1D3A' : '#D3DEF3',\n      heldBg: key === 'held' ? '#FFFFFF' : 'rgba(255, 255, 255, 0)',\n      heldFg: key === 'held' ? '#0B1D3A' : '#D3DEF3',\n      pickReady: () => this.play('ready'),\n      pickHeld: () => this.play('held'),\n      replay: () => this.play(this.state.scenario),\n      answer: () => this.setState({ answered: true, phase: 'ready', hover: null }),\n      confirm: () => {\n        if (this.state.phase !== 'ready') return;\n        this.setState({ phase: 'sending' });\n        this.later(() => this.setState({ phase: 'sent' }), this.calm() ? 0 : 1100);\n      },\n      heroOpen: !st.heroJoined,\n      heroJoined: st.heroJoined,\n      heroError: st.heroError,\n      heroEmail: st.heroEmail,\n      heroInput: (e) => this.setState({ heroEmail: e.target.value, heroError: false }),\n      heroJoin: () => this.join('hero'),\n      heroKey: (e) => {\n        if (e.key === 'Enter') this.join('hero');\n      },\n      endOpen: !st.endJoined,\n      endJoined: st.endJoined,\n      endError: st.endError,\n      endEmail: st.endEmail,\n      endInput: (e) => this.setState({ endEmail: e.target.value, endError: false }),\n      endJoin: () => this.join('end'),\n      endKey: (e) => {\n        if (e.key === 'Enter') this.join('end');\n      }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
